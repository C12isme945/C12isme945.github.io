<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" fill="none">
  <defs>
    <radialGradient id="studio-bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#060911"/>
    </radialGradient>
    <radialGradient id="ambient-blue" cx="0.35" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#00c7be" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-indigo" cx="0.7" cy="0.65" r="0.45">
      <stop offset="0" stop-color="#5856d6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5856d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ha-node" cx="0.3" cy="0.24" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#a5f3fc"/>
      <stop offset="0.62" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#002b5e"/>
    </radialGradient>
    <radialGradient id="pep-node" cx="0.3" cy="0.24" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.26" stop-color="#e0e7ff"/>
      <stop offset="0.65" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#312e81"/>
    </radialGradient>
    <linearGradient id="ha-strand" x1="90" y1="390" x2="470" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="0.75" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="pep-strand" x1="120" y1="145" x2="470" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="apple-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#94a3b8" opacity="0.16"/>
    </pattern>
    <filter id="sphere-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="soft-blur">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <!-- Studio Canvas -->
  <rect width="600" height="560" fill="url(#studio-bg)"/>
  <rect width="600" height="560" fill="url(#ambient-blue)"/>
  <rect width="600" height="560" fill="url(#ambient-indigo)"/>
  <rect width="600" height="560" fill="url(#apple-grid)"/>

  <!-- Precision Orbital Rings -->
  <g stroke="#e2e8f0" stroke-width="0.75" opacity="0.14">
    <circle cx="306" cy="276" r="192"/>
    <circle cx="306" cy="276" r="152" stroke-dasharray="3 7"/>
    <circle cx="306" cy="276" r="108" opacity="0.6"/>
    <path d="M306 58v32m0 372v32M80 276h32m388 0h32"/>
  </g>
  <ellipse cx="306" cy="276" rx="234" ry="82" stroke="#38bdf8" stroke-width="0.9" opacity="0.18" transform="rotate(-34 306 276)"/>
  <ellipse cx="306" cy="276" rx="210" ry="70" stroke="#818cf8" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.15" transform="rotate(28 306 276)"/>

  <!-- Active Learning Force-Field Couplings -->
  <g stroke="#7dd3fc" stroke-width="1" stroke-dasharray="2 5" opacity="0.42">
    <line x1="212" y1="236" x2="226" y2="155"/>
    <line x1="256" y1="284" x2="297" y2="226"/>
    <line x1="299" y1="336" x2="317" y2="277"/>
    <line x1="351" y1="342" x2="340" y2="326"/>
  </g>

  <!-- HA Macromolecular Backbone -->
  <path d="M102 383C68 287 131 212 212 244S295 410 377 325 484 242 447 137" stroke="#020617" stroke-width="26" stroke-linecap="round" opacity="0.5"/>
  <path d="M102 375C68 279 131 204 212 236S295 402 377 317 484 234 447 129" stroke="url(#ha-strand)" stroke-width="15" stroke-linecap="round"/>
  <path d="M102 371C75 280 134 213 211 241S295 394 377 312 475 229 448 127" stroke="#e0f2fe" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>

  <!-- Signal Peptide Backbone -->
  <path d="M139 152C201 107 260 179 297 231S356 406 465 399" stroke="#020617" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  <path d="M139 147C201 102 260 174 297 226S356 401 465 394" stroke="url(#pep-strand)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- HA Monomer Spheres -->
  <g fill="url(#ha-node)" filter="url(#sphere-shadow)">
    <circle cx="102" cy="375" r="23"/>
    <circle cx="99" cy="298" r="19"/>
    <circle cx="149" cy="238" r="23"/>
    <circle cx="212" cy="236" r="19"/>
    <circle cx="256" cy="284" r="26"/>
    <circle cx="299" cy="336" r="20"/>
    <circle cx="351" cy="342" r="24"/>
    <circle cx="397" cy="291" r="19"/>
    <circle cx="444" cy="239" r="24"/>
    <circle cx="460" cy="178" r="19"/>
    <circle cx="447" cy="129" r="23"/>
  </g>

  <!-- Signal Peptide Residue Spheres -->
  <g fill="url(#pep-node)" filter="url(#sphere-shadow)">
    <circle cx="139" cy="147" r="13"/>
    <circle cx="186" cy="136" r="11"/>
    <circle cx="226" cy="155" r="13"/>
    <circle cx="263" cy="187" r="11"/>
    <circle cx="297" cy="226" r="14.5"/>
    <circle cx="317" cy="277" r="11.5"/>
    <circle cx="340" cy="326" r="13"/>
    <circle cx="374" cy="365" r="11"/>
    <circle cx="419" cy="388" r="13"/>
    <circle cx="465" cy="394" r="15"/>
  </g>

  <!-- Binding Pocket Highlight Ring -->
  <circle cx="297" cy="226" r="24" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
  <circle cx="256" cy="284" r="34" stroke="#60a5fa" stroke-width="1" opacity="0.35"/>

  <!-- Precision Callout Lines -->
  <g stroke="#94a3b8" opacity="0.5" stroke-width="0.9">
    <path d="m128 386-45 28H46"/>
    <path d="m367 334 36 26h104"/>
    <path d="m209 139 25-44h74"/>
  </g>

  <!-- Apple Keynote HUD Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" fill="#f8fafc">
    <text x="46" y="438" font-size="22" font-weight="600" letter-spacing="-0.5">HA<tspan dx="10" font-size="9" font-weight="500" letter-spacing="1.4" fill="#94a3b8">HYALURONIC ACID</tspan></text>
    <text x="434" y="350" font-size="18" font-weight="600" fill="#c7d2fe">PEP<tspan dx="8" font-size="8.5" font-weight="500" letter-spacing="1.2" fill="#94a3b8">PEPTIDE</tspan></text>
    <text x="236" y="84" font-family="'SF Mono', Consolas, monospace" font-size="8.5" letter-spacing="1.6" fill="#7dd3fc" opacity="0.85">SIGNAL PEPTIDE · ACTIVE LEARNING</text>
    <text x="306" y="502" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="8" fill="#ffffff" opacity="0.04">HA × PEP</text>
  </g>

  <!-- Ambient Particles -->
  <g fill="#7dd3fc" opacity="0.6">
    <circle cx="78" cy="196" r="2"/>
    <circle cx="374" cy="91" r="2"/>
    <circle cx="508" cy="309" r="2"/>
    <circle cx="250" cy="433" r="2"/>
  </g>
</svg>
